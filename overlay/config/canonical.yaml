# Benchmark canonical bag (Hesai QT64 as sensor_msgs/PointCloud2: x y z intensity,
# ring, float32 time [s] relative to the header stamp, uint32 t [ns]; IMU in the
# lidar frame, m/s^2). Upstream velodyne.yaml (KITTI, lidar-only) with the sensor
# description changed: topics; lidar_type 5 (VELO32: every point, per-point time
# and ring; the velodyne one keeps only the HDL-64 elevation window, -24.3 to
# +2 deg, of the QT64's -52.5 to +52.1 deg); calib_laser false (KITTI's 0.15 deg
# vertical correction); blind 0.5. Beyond the sensor description: imu_en true
# (identity extrinsic, default noise scales), so the IMU propagates and deskews;
# the Dockerfile patches VELO32's time unit (it expects microseconds).
common:
    lid_topic:  "/lidar/pointcloud"
    imu_topic:  "/lidar/imu"

preprocess:
    lidar_type: 5                #1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for L515 LiDAR
    scan_line: 64
    blind: 0.5
    point_filter_num: 1
    calib_laser: false             # true for KITTI Odometry dataset

mapping:
    down_sample_size: 0.5
    max_iteration: 3
    voxel_size: 3.0
    max_layer: 3                # 4 layer, 0, 1, 2, 3
    layer_point_size: [5, 5, 5, 5, 5]
    plannar_threshold: 0.01

voxel_merging:
    enable_voxel_merging: true
    merge_theta_thresh: 0.2
    merge_dist_thresh: 0.1
    merge_cov_min_eigen_val_thresh: 0.001
    merge_x_coord_diff_thresh: 10.0
    merge_y_coord_diff_thresh: 10.0

noise_model:
    ranging_cov: 0.04
    angle_cov: 0.1
    acc_cov_scale: 1.0
    gyr_cov_scale: 0.5

imu:
    imu_en: true
    extrinsic_T: [ 0, 0, 0]
    extrinsic_R: [ 1, 0, 0, 
                   0, 1, 0, 
                   0, 0, 1]

visualization:
    pub_voxel_map: false
    publish_max_voxel_layer: 1         # only publish 0,1,2 layer's plane
    pub_point_cloud: true
    dense_map_enable: false
    pub_point_cloud_skip: 5             # publish one points per five points
    pub_merged_voxel: false

Result:
    write_kitti_log: false
    result_path: ""